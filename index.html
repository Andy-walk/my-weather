<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172033"><title>My Weather</title><style>body{margin:0;background:#0d1320;color:#eef2ff;font-family:system-ui,sans-serif}main{max-width:980px;margin:auto;padding:14px}.card{background:#182236;border:1px solid #2b3850;border-radius:18px;padding:15px;margin:12px 0}header,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}h1,h2{margin:0}button,input{font:inherit;border-radius:10px;padding:10px;background:#101827;color:#fff;border:1px solid #40506b}button{cursor:pointer}.blue{background:#3478e5}.hide{display:none}.muted{color:#aebbd0;font-size:.9rem}.error{color:#ffb2b2}.current{display:grid;grid-template-columns:1fr 1fr;gap:16px}.temp{font-size:5rem;font-weight:700}.hero{display:flex;align-items:center}.hero img{width:105px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#111a2a;padding:10px;border-radius:12px}.stat b{display:block;margin-top:3px}.scroll{display:flex;overflow:auto;gap:8px}.hour,.rain{min-width:76px;text-align:center;background:#111a2a;border-radius:12px;padding:9px}.hour img{width:45px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{text-align:center;background:#111a2a;border-radius:12px;padding:8px;font-size:.82rem}.day img{width:48px}.alert{border-color:#7d4a4a;background:#2b1a20}@media(max-width:650px){.current{grid-template-columns:1fr}.days{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}} </style></head><body><main><header><div><h1>🌦️ My Weather</h1><div class="muted">One Call 4.0 · refreshes every 15 minutes</div></div><button id="refresh">↻ Refresh</button></header><div class="card row"><div><b id="title">Weather</b><div class="muted" id="updated">Not loaded</div></div><button id="setBtn">⚙ Settings</button></div><div id="settings" class="card hide"><div class="row"><input id="key" type="password" placeholder="OpenWeather API key"><input id="placeInput" placeholder="City, e.g. London"></div><br><button class="blue" id="save">Save & Load Weather</button> <button id="gps">📍 Use my location</button></div><div id="message" class="card muted">Enter your API key in Settings to start.</div><section id="current" class="card hide"><div class="current"><div><div class="muted" id="place"></div><div class="hero"><div class="temp" id="temp">--°</div><img id="ico"></div><h2 id="desc"></h2></div><div class="stats"><div class="stat">Feels like<b id="feels">--</b></div><div class="stat">Humidity<b id="hum">--</b></div><div class="stat">Wind<b id="wind">--</b></div><div class="stat">Pressure<b id="press">--</b></div><div class="stat">UV index<b id="uv">--</b></div><div class="stat">Dew point<b id="dew">--</b></div><div class="stat">Cloud<b id="cloud">--</b></div><div class="stat">Visibility<b id="vis">--</b></div><div class="stat">Sunrise<b id="sunrise">--</b></div><div class="stat">Sunset<b id="sunset">--</b></div></div></div></section><section id="hoursCard" class="card hide"><h2>Next 24 hours</h2><div id="hours" class="scroll"></div></section><section id="daysCard" class="card hide"><h2>7-day forecast</h2><div id="days" class="days"></div></section><section id="rainCard" class="card hide"><h2>Rain next 12 hours</h2><div id="rain" class="scroll"></div></section><section id="alertCard" class="card alert hide"><h2>⚠ Weather alerts</h2><div id="alerts"></div></section></main><script>
const $=id=>document.getElementById(id);let coords=null,timer=null;$('key').value=localStorage.getItem('weatherKey')||'';$('placeInput').value=localStorage.getItem('weatherPlace')||'London';$('setBtn').onclick=()=>$('settings').classList.toggle('hide');$('refresh').onclick=load;$('save').onclick=()=>{localStorage.setItem('weatherKey',$('key').value.trim());localStorage.setItem('weatherPlace',$('placeInput').value.trim());coords=null;load()};$('gps').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{coords={lat:p.coords.latitude,lon:p.coords.longitude};load()},()=>msg('Location permission was not available.',1));function msg(t,e=0){$('message').textContent=t;$('message').className='card '+(e?'error':'muted');$('message').classList.remove('hide')}function clock(t){return new Date(t*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}function date(t){return new Date(t*1000).toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'})}function icon(i){return 'https://openweathermap.org/img/wn/'+i+'@2x.png'}async function get(u){let r=await fetch(u),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||('OpenWeather error '+r.status));return d}async function timeline(step,p){let u='https://api.openweathermap.org/data/4.0/onecall/timeline/'+step+'?'+new URLSearchParams(p),a=[];for(let i=0;i<5&&u;i++){let d=await get(u);a.push(...(d.data||[]));u=d.next||null}return a}async function load(){let key=$('key').value.trim();if(!key){$('settings').classList.remove('hide');msg('Please enter your OpenWeather API key.',1);return}msg('Loading weather…');try{let lat,lon,place;if(coords){({lat,lon}=coords);place='Current location'}else{let g=await get('https://api.openweathermap.org/geo/1.0/direct?'+new URLSearchParams({q:$('placeInput').value.trim()||'London',limit:1,appid:key}));if(!g.length)throw Error('Location not found.');lat=g[0].lat;lon=g[0].lon;place=[g[0].name,g[0].state,g[0].country].filter(Boolean).join(', ')}let p={lat,lon,appid:key,units:'metric',lang:'en'};let c=await get('https://api.openweathermap.org/data/4.0/onecall/current?'+new URLSearchParams(p));let cur=c.data||c;let hour=await timeline('1h',p),day=await timeline('1day',p),min=await timeline('15min',p);$('place').textContent=place;$('title').textContent=place;$('temp').textContent=Math.round(cur.temp)+'°';$('desc').textContent=cur.weather?.[0]?.description||'';$('ico').src=icon(cur.weather?.[0]?.icon||'01d');$('feels').textContent=Math.round(cur.feels_like)+'°C';$('hum').textContent=(cur.humidity??'--')+'%';$('wind').textContent=cur.wind_speed==null?'--':Math.round(cur.wind_speed*3.6)+' km/h';$('press').textContent=(cur.pressure??'--')+' hPa';$('uv').textContent=cur.uvi==null?'--':Number(cur.uvi).toFixed(1);$('dew').textContent=cur.dew_point==null?'--':Math.round(cur.dew_point)+'°C';$('cloud').textContent=(cur.clouds??'--')+'%';$('vis').textContent=cur.visibility==null?'--':Math.round(cur.visibility/1000)+' km';$('sunrise').textContent=cur.sunrise?clock(cur.sunrise):'--';$('sunset').textContent=cur.sunset?clock(cur.sunset):'--';$('updated').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('current').classList.remove('hide');$('hours').innerHTML=hour.slice(0,24).map(x=>'<div class="hour"><div>'+clock(x.dt)+'</div><img src="'+icon(x.weather?.[0]?.icon||'01d')+'"><b>'+Math.round(x.temp)+'°</b><div>'+Math.round((x.pop||0)*100)+'% rain</div></div>').join('');$('hoursCard').classList.remove('hide');$('days').innerHTML=day.slice(0,7).map((x,i)=>{let t=x.temp||{},hi=x.temp_max??t.max??x.temp,lo=x.temp_min??t.min??x.temp;return '<div class="day"><b>'+(i?'': 'Today')+(i?date(x.dt):'')+'</b><img src="'+icon(x.weather?.[0]?.icon||'01d')+'"><div>'+(x.weather?.[0]?.description||'')+'</div><strong>'+Math.round(hi)+'° / '+Math.round(lo)+'°</strong><div>'+Math.round((x.pop||0)*100)+'% rain</div></div>'}).join('');$('daysCard').classList.remove('hide');$('rain').innerHTML=min.slice(0,48).map(x=>'<div class="rain"><div>'+clock(x.dt)+'</div><b>'+Number(x.precipitation??x.rain??0).toFixed(1)+' mm</b></div>').join('');$('rainCard').classList.toggle('hide',!min.length);let alerts=cur.alerts||[];$('alerts').innerHTML=alerts.map(a=>'<h3>'+(a.event||'Weather alert')+'</h3><div>'+(a.description||'')+'</div>').join('');$('alertCard').classList.toggle('hide',!alerts.length);$('message').classList.add('hide');clearInterval(timer);timer=setInterval(load,900000)}catch(e){msg(e.message,1)}}if(localStorage.getItem('weatherKey'))load();</script></body></html>
