<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Weather</title><style>body{font-family:system-ui;margin:0;background:#0d1320;color:#eef2ff}main{max-width:900px;margin:auto;padding:14px}.card{background:#182236;border:1px solid #2b3850;border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}button,input{font:inherit;padding:10px;border-radius:9px;background:#101827;color:white;border:1px solid #40506b}.hide{display:none}.muted{color:#aebbd0}.error{color:#ffb2b2}.temp{font-size:5rem;font-weight:bold}.hero{display:flex;align-items:center}.hero img{width:100px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#111a2a;padding:9px;border-radius:10px}.stat b{display:block}.scroll{display:flex;gap:8px;overflow:auto}.item{min-width:80px;text-align:center;background:#111a2a;padding:8px;border-radius:10px}.item img{width:42px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{text-align:center;background:#111a2a;padding:8px;border-radius:10px;font-size:.8rem}.day img{width:45px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.days{grid-template-columns:repeat(2,1fr)}} </style></head><body><main><div class="row"><div><h1>🌦️ My Weather</h1><div class="muted">One Call 4.0 · refreshes every 15 minutes</div></div><button id="refresh">↻ Refresh</button></div><div class="card row"><div><b id="title">Weather</b><div class="muted" id="updated">Not loaded</div></div><button id="settingsBtn">⚙ Settings</button></div><div id="settings" class="card hide"><input id="key" type="password" placeholder="OpenWeather API key" style="width:100%"><br><br><input id="place" value="London" placeholder="City or town" style="width:100%"><br><br><button id="save">Save & Load Weather</button></div><div id="message" class="card muted">Enter your API key in Settings to start.</div><section id="current" class="card hide"><div class="hero"><div><div class="muted" id="location"></div><div id="temp" class="temp">--°</div><h2 id="description"></h2></div><img id="icon"></div><div class="stats"><div class="stat">Feels like<b id="feels">--</b></div><div class="stat">Humidity<b id="humidity">--</b></div><div class="stat">Wind<b id="wind">--</b></div><div class="stat">Pressure<b id="pressure">--</b></div><div class="stat">Cloud<b id="cloud">--</b></div><div class="stat">Visibility<b id="visibility">--</b></div><div class="stat">Dew point<b id="dew">--</b></div><div class="stat">UV<b id="uvi">--</b></div><div class="stat">Sunrise<b id="sunrise">--</b></div><div class="stat">Sunset<b id="sunset">--</b></div></div></section><section id="minsCard" class="card hide"><h2>15-minute forecast</h2><div id="mins" class="scroll"></div></section><section id="hoursCard" class="card hide"><h2>Hourly forecast</h2><div id="hours" class="scroll"></div></section><section id="daysCard" class="card hide"><h2>7-day forecast</h2><div id="days" class="days"></div></section><section id="alertsCard" class="card hide"><h2>⚠ Weather alerts</h2><div id="alerts"></div></section></main><script>
const $=x=>document.getElementById(x),BASE="https://api.openweathermap.org/data/4.0/onecall/timeline/";let timer;
$("key").value=localStorage.getItem("weatherKey")||"";$("place").value=localStorage.getItem("weatherPlace")||"London";$("settingsBtn").onclick=()=>$("settings").classList.toggle("hide");$("refresh").onclick=load;$("save").onclick=()=>{localStorage.setItem("weatherKey",$("key").value.trim());localStorage.setItem("weatherPlace",$("place").value.trim());load()};
function msg(t,e){$("message").textContent=t;$("message").className="card "+(e?"error":"muted");$("message").classList.remove("hide")}function tm(t){return new Date(t*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}function dt(t){return new Date(t*1000).toLocaleDateString([],{weekday:"short",day:"numeric",month:"short"})}function ic(i){return"https://openweathermap.org/img/wn/"+i+"@2x.png"}
async function get(u){const r=await fetch(u),d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||"OpenWeather HTTP "+r.status);return d}
async function load(){const key=$("key").value.trim(),q=$("place").value.trim()||"London";if(!key){$("settings").classList.remove("hide");msg("Please enter your OpenWeather API key.",true);return}msg("Loading weather…");try{const g=await get("https://api.openweathermap.org/geo/1.0/direct?"+new URLSearchParams({q,limit:1,appid:key}));if(!g.length)throw Error("Location not found.");const p={lat:g[0].lat,lon:g[0].lon,appid:key,units:"metric",lang:"en"};const [d,daysData]=await Promise.all([get(BASE+"15min?"+new URLSearchParams(p)),get(BASE+"1day?"+new URLSearchParams(p))]),a=d.data||[],days=daysData.data||[];if(!a.length)throw Error("No 15-minute weather data returned.");const c=a[0],w=c.weather?.[0]||{};$("title").textContent=[g[0].name,g[0].state,g[0].country].filter(Boolean).join(", ");$("location").textContent=$("title").textContent;$("temp").textContent=Math.round(c.temp)+"°";$("description").textContent=w.description||"";$("icon").src=ic(w.icon||"01d");$("feels").textContent=c.feels_like==null?"--":Math.round(c.feels_like)+"°C";$("humidity").textContent=(c.humidity??"--")+"%";$("wind").textContent=c.wind_speed==null?"--":Math.round(c.wind_speed*3.6)+" km/h";$("pressure").textContent=(c.pressure??"--")+" hPa";$("cloud").textContent=(c.clouds??"--")+"%";$("visibility").textContent=c.visibility==null?"--":Math.round(c.visibility/1000)+" km";$("dew").textContent=c.dew_point==null?"--":Math.round(c.dew_point)+"°C";$("uvi").textContent=c.uvi==null?"--":Number(c.uvi).toFixed(1);$("sunrise").textContent=c.sunrise?tm(c.sunrise):"--";$("sunset").textContent=c.sunset?tm(c.sunset):"--";$("updated").textContent="Updated "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});$("current").classList.remove("hide");$("mins").innerHTML=a.slice(0,49).map(x=>`<div class=item><div>${tm(x.dt)}</div><img src=${ic(x.weather?.[0]?.icon||"01d")}><b>${Math.round(x.temp)}°</b><div>${Math.round((x.pop||0)*100)}% rain</div></div>`).join("");$("minsCard").classList.remove("hide");const h=[];for(let i=0;i<a.length;i+=4)h.push(a[i]);$("hours").innerHTML=h.slice(0,24).map(x=>`<div class=item><div>${tm(x.dt)}</div><img src=${ic(x.weather?.[0]?.icon||"01d")}><b>${Math.round(x.temp)}°</b><div>${Math.round((x.pop||0)*100)}% rain</div></div>`).join("");$("hoursCard").classList.remove("hide");$("days").innerHTML=days.slice(0,7).map((x,i)=>{const t=x.temp||{},hi=x.temp_max??t.max??x.temp,lo=x.temp_min??t.min??x.temp,w=x.weather?.[0]||{};return`<div class=day><b>${i===0?"Today":dt(x.dt)}</b><img src=${ic(w.icon||"01d")}><div>${w.description||""}</div><strong>${hi==null?"--":Math.round(hi)}° / ${lo==null?"--":Math.round(lo)}°</strong><div>${Math.round((x.pop||0)*100)}% rain</div></div>`}).join("");$("daysCard").classList.remove("hide");const alerts=c.alerts||[];$("alerts").innerHTML=alerts.map(x=>`<h3>${x.event||"Weather alert"}</h3><div>${x.description||""}</div>`).join("");$("alertsCard").classList.toggle("hide",!alerts.length);$("message").classList.add("hide");clearInterval(timer);timer=setInterval(load,900000)}catch(e){console.error(e);msg(e.message||"Failed to fetch weather data.",true)}}
if(localStorage.getItem("weatherKey"))load();
</script></body></html>
