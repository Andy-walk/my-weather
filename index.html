<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Weather</title><style>body{font-family:system-ui;margin:0;background:#0d1320;color:#fff}main{max-width:950px;margin:auto;padding:15px}.card{background:#182236;border:1px solid #2b3850;border-radius:18px;padding:15px;margin:12px 0}.row{display:flex;gap:10px;justify-content:space-between;align-items:center}button,input{font:inherit;padding:10px;border-radius:10px;background:#101827;color:#fff;border:1px solid #40506b}.blue{background:#3478e5}.hide{display:none}.muted{color:#aebbd0}.current{display:grid;grid-template-columns:1fr 1fr;gap:15px}.temp{font-size:5rem;font-weight:700}.hero{display:flex;align-items:center}.hero img{width:100px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat{background:#111a2a;padding:10px;border-radius:12px}.stat b{display:block}.scroll{display:flex;overflow:auto;gap:8px}.item{min-width:75px;text-align:center;background:#111a2a;border-radius:12px;padding:9px}.item img{width:45px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{text-align:center;background:#111a2a;border-radius:12px;padding:8px;font-size:.82rem}.day img{width:48px}.error{color:#ffb2b2}@media(max-width:650px){.current{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.days{grid-template-columns:repeat(2,1fr)}} </style></head><body><main><header class="row"><div><h1>🌦️ My Weather</h1><div class="muted">One Call 4.0 · updates every 15 minutes</div></div><button id="refresh">↻ Refresh</button></header><section class="card row"><div><b id="title">Weather</b><div id="updated" class="muted">Not loaded</div></div><button id="settingsBtn">⚙ Settings</button></section><section id="settings" class="card hide"><input id="key" type="password" placeholder="OpenWeather API key"><input id="location" placeholder="City, e.g. London"><br><br><button class="blue" id="save">Save & Load Weather</button> <button id="gps">📍 Use my location</button></section><section id="message" class="card muted">Enter your API key in Settings to start.</section><section id="current" class="card hide"><div class="current"><div><div id="place" class="muted"></div><div class="hero"><div id="temp" class="temp">--°</div><img id="icon"></div><h2 id="desc"></h2></div><div id="stats" class="stats"></div></div></section><section id="hourCard" class="card hide"><h2>Next 24 hours</h2><div id="hours" class="scroll"></div></section><section id="dayCard" class="card hide"><h2>7-day forecast</h2><div id="days" class="days"></div></section><section id="rainCard" class="card hide"><h2>Rain next 12 hours</h2><div id="rain" class="scroll"></div></section><section id="alertCard" class="card hide"><h2>⚠ Weather alerts</h2><div id="alerts"></div></section></main><script>
const $=id=>document.getElementById(id),BASE='https://api.openweathermap.org/data/4.0/onecall/';let coords=null,timer;
$('key').value=localStorage.getItem('owmKey')||'';$('location').value=localStorage.getItem('owmLocation')||'London';
$('settingsBtn').onclick=()=>$('settings').classList.toggle('hide');$('refresh').onclick=load;$('save').onclick=()=>{localStorage.setItem('owmKey',$('key').value.trim());localStorage.setItem('owmLocation',$('location').value.trim());coords=null;load()};$('gps').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{coords={lat:p.coords.latitude,lon:p.coords.longitude};load()},()=>show('Location permission was not available.',1));
function show(t,e=0){$('message').textContent=t;$('message').className='card '+(e?'error':'muted');$('message').classList.remove('hide')};function tm(t){return new Date(t*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};function dt(t){return new Date(t*1000).toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'})};function img(i){return 'https://openweathermap.org/img/wn/'+i+'@2x.png'}
async function api(url){const r=await fetch(url);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||('OpenWeather HTTP '+r.status));return d}
async function timeline(step,p){let url=BASE+'timeline/'+step+'?'+new URLSearchParams(p),out=[];for(let i=0;i<5&&url;i++){const d=await api(url);out.push(...(d.data||[]));url=d.next||null}return out}
async function load(){const key=$('key').value.trim();if(!key){$('settings').classList.remove('hide');show('Please enter your OpenWeather API key.',1);return}show('Loading weather…');try{let lat,lon,place;if(coords){({lat,lon}=coords);place='Current location'}else{const g=await api('https://api.openweathermap.org/geo/1.0/direct?'+new URLSearchParams({q:$('location').value.trim()||'London',limit:1,appid:key}));if(!g.length)throw Error('Location not found.');lat=g[0].lat;lon=g[0].lon;place=[g[0].name,g[0].state,g[0].country].filter(Boolean).join(', ')}const p={lat,lon,units:'metric',lang:'en',appid:key};const cur=await api(BASE+'current?'+new URLSearchParams(p));const h=await timeline('1h',p),d=await timeline('1day',p),m=await timeline('15min',p);$('place').textContent=place;$('title').textContent=place;$('temp').textContent=Math.round(cur.temp)+'°';$('desc').textContent=cur.weather?.[0]?.description||'';$('icon').src=img(cur.weather?.[0]?.icon||'01d');$('stats').innerHTML=[['Feels like',Math.round(cur.feels_like)+'°C'],['Humidity',(cur.humidity??'--')+'%'],['Wind',cur.wind_speed==null?'--':Math.round(cur.wind_speed*3.6)+' km/h'],['Pressure',(cur.pressure??'--')+' hPa'],['UV index',cur.uvi==null?'--':Number(cur.uvi).toFixed(1)],['Dew point',cur.dew_point==null?'--':Math.round(cur.dew_point)+'°C'],['Cloud',(cur.clouds??'--')+'%'],['Visibility',cur.visibility==null?'--':Math.round(cur.visibility/1000)+' km'],['Sunrise',cur.sunrise?tm(cur.sunrise):'--'],['Sunset',cur.sunset?tm(cur.sunset):'--']].map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('');$('updated').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('current').classList.remove('hide');$('hours').innerHTML=h.slice(0,24).map(x=>`<div class="item"><div>${tm(x.dt)}</div><img src="${img(x.weather?.[0]?.icon||'01d')}"><b>${Math.round(x.temp)}°</b><div>${Math.round((x.pop||0)*100)}%</div></div>`).join('');$('hourCard').classList.remove('hide');$('days').innerHTML=d.slice(0,7).map((x,i)=>{const t=x.temp||{};return `<div class="day"><b>${i?'': 'Today'}${i?dt(x.dt):''}</b><img src="${img(x.weather?.[0]?.icon||'01d')}"><div>${x.weather?.[0]?.description||''}</div><strong>${Math.round(x.temp_max??t.max??x.temp)}° / ${Math.round(x.temp_min??t.min??x.temp)}°</strong><div>${Math.round((x.pop||0)*100)}% rain</div></div>`}).join('');$('dayCard').classList.remove('hide');$('rain').innerHTML=m.slice(0,48).map(x=>`<div class="item"><div>${tm(x.dt)}</div><b>${Number(x.precipitation??0).toFixed(1)} mm</b></div>`).join('');$('rainCard').classList.toggle('hide',!m.length);const alerts=cur.alerts||[];$('alerts').innerHTML=alerts.map(a=>`<h3>${a.event||'Weather alert'}</h3><div>${a.description||''}</div>`).join('');$('alertCard').classList.toggle('hide',!alerts.length);$('message').classList.add('hide');clearInterval(timer);timer=setInterval(load,900000)}catch(e){show(e.message||String(e),1)}}if(localStorage.getItem('owmKey'))load();
</script></body></html>
